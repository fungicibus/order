sources:
  order_logs:
    type: docker_logs
    include_containers: 
      - order
    auto_partial_merge: true
    
transforms:
  to_json:
    type: remap
    inputs:
      - order_logs
    source: |
      # Docker logs source provides the container output in the "message" field
      # We need to parse this JSON string into structured data
      . = parse_json!(.message)

sinks:
  console:
    type: console
    inputs: 
      - to_json
    encoding:
      codec: json
    
  vlogs:
    inputs:
      - to_json
    type: elasticsearch
    endpoints:
      - https://vl.shift-1703.online/insert/elasticsearch
    api_version: v8
    compression: gzip
    healthcheck:
      enabled: false
    query:
      _msg_field: message
      _time_field: timestamp
      _stream_fields: app,env
