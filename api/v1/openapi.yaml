openapi: 3.0.0
info:
  title: Fungicibus Order Service API
  description: API for managing orders
  version: 1.0.0

servers:
  - url: /api/v1

components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Enter the API key as a plain string (e.g., "your-api-key")
  schemas:
    # Error
    ErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/ErrorItem"
    ErrorItem:
      type: object
      required:
        - id
        - status
        - detail
        - meta
      properties:
        id:
          type: string
          description: Identificator of a request
          example: bd124f62-27ff-4ed7-ad8b-5df0fa73e2c1
        status:
          type: string
          description: The HTTP status code applicable to this problem, expressed as a string value
          example: "400"
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem
          example: Bad commodity name
        source:
          $ref: "#/components/schemas/ErrorSource"
        meta:
          $ref: "#/components/schemas/ErrorMeta"
    ErrorSource:
      type: object
      required:
        - pointer
      properties:
        pointer:
          type: string
          description: a JSON Pointer [RFC6901] to the value in the request document that caused the error
          example: /data/quantity
    ErrorMeta:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the occurrence of the problem in RFC3339 format
          example: 2025-01-02T15:04:05Z07:00

    CreateOrderRequest:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CreateOrderItem"

    CreateOrderItem:
      type: object
      required:
        - user_id
        - products
        - timestamp
        - order_total
      properties:
        user_id: 
          type: string
          description: Id of an user
          example: "3a550dd9-c7d4-4c77-a73a-fcd13ce76712"
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductItem"
        timestamp: 
          type: string
          description: Timestamp of an order in RFC3339 format
          example: "2006-01-02T15:04:05"
        order_total: 
          type: number
          format: float
          description: Total price of an order
          example: 188.88
        comment: 
          type: string
          description: Comment to an order
          example: "Some comment"
      
    ProductItem:
      type: object
      required:
        - id
        - quantity
        - price
      properties:
        id: 
          type: string
          description: Id of a product
          example: "3a550dd9-c7d4-4c77-a73a-fcd13ce76712"
        quantity: 
          type: integer
          description: Quantity of a product
          example: 1
        price: 
          type: number
          format: float
          description: Price of a product
          example: 18.88

    CreateOrderResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/OrderItem"

    OrderItem:
      type: object
      required:
        - id
        - status
        - user_id
        - products
        - timestamp
        - order_total
      properties:
        id:
          type: string
          description: Id of created order
          example: "3a550dd9-c7d4-4c77-a73a-fcd13ce76712"
        status:
          type: string
          description: Status of created order
          enum:
            - pending
            - rejected
            - confirmed
            - cancelled_by_user
            - cancelled_by_company 
            - processing
            - ready_for_shipping
            - delivering
            - delivered
            - ready_for_pickup
            - complete
        user_id: 
          type: string
          description: Id of an user
          example: "3a550dd9-c7d4-4c77-a73a-fcd13ce76712"
        products:
          type: array
          items:
            $ref: "#/components/schemas/ProductItem"
        timestamp: 
          type: string
          description: Timestamp of an order in RFC3339 format
          example: "2006-01-02T15:04:05"
        order_total: 
          type: number
          format: float
          description: Total price of an order
          example: 188.88
        comment: 
          type: string
          description: Comment to an order
          example: "Some comment"
    
    AdminGetOrdersResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/OrderItem"

paths:
  /orders:
    post:
      summary: Create order
      operationId: CreateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "400":
          description: Request error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    
  /admin/orders:
    get:
      summary: Get all orders
      operationId: AdminGetOrders
      security:
        - apiKeyAuth: []
      responses:
        "200":
          description: List of all orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminGetOrdersResponse"
        "401":
          description: Unauthorized - Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      